# temperature-skeleton: the walking skeleton for the rig.
# Proves the plumbing end to end on real hardware, with almost no demo logic.
description: Walking skeleton - TC397 temperature to two HPCs, alerts on Windows
domain: 0            # confirmed from the TC397 source (publisher_main_w_args(0, ...))

nodes:
  windows: { ip: 172.23.100.102, os: windows, run: [result_gui, control_panel, ivi_standin] }
  hpc-vm:  { ip: 172.23.100.110, os: linux,   run: ["hpc_monitor --strength 20"] }
  hpc-pi:  { ip: 172.23.100.121, os: linux, arch: aarch64, run: ["hpc_monitor --strength 10"] }
  tc397:   { ip: 172.23.100.101, external: true, arch: tricore, sim: tc397_twin }

# IPs: tc397 (.101) and windows (.102) are confirmed by the TC397 source.
# hpc-vm (.110) and hpc-pi (.121) are placeholders: set them to the addresses
# you give the VM and the Pi.
# WARNING: the TC397 tracks at most 5 remote participants (see external/tc397/README.md).
