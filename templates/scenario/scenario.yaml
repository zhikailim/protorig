# {{name}}: {{description}}
# Which apps run on which machine. See docs/WORKFLOW.md (scenarios) for every key.
description: {{description}}
domain: 0

nodes:
  # One entry per machine. `run` entries are written like command lines.
  hpc-vm: { ip: 192.168.1.10, os: linux, run: [node_agent] }
  # An external node (built outside this repo) with its sim twin for --sim runs:
  # tc397:  { ip: 192.168.1.30, external: true, sim: tc397_twin }
